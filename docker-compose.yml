services:
  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs
      - ./www.visioncreativa.local:/usr/share/nginx/html/www:ro
      - ./intranet.visioncreativa.local:/usr/share/nginx/html/intranet:ro

  code:
    image: linuxserver/code-server:latest
    restart: unless-stopped
    environment:
      - PASSWORD=${CODE_PASSWORD:?Falta CODE_PASSWORD en .env}
    volumes:
      - .:/config/workspace/intranet

  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    command:
      - --http-enabled
      - --base-url=/portainer
      - --trusted-origins=intranet.visioncreativa.local
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

  adminer:
    image: adminer
    restart: unless-stopped
    environment:
      - ADMINER_DEFAULT_SERVER=db

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_PASSWORD:?Falta DB_PASSWORD en .env}
      - MARIADB_DATABASE=clase
    volumes:
      - db_datos:/var/lib/mysql

volumes:
  portainer_data:
  db_datos: