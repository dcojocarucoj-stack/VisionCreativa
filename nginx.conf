# Cabeceras comunes para los proxys (WebSockets incluidos)
proxy_http_version 1.1;
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        "upgrade";
proxy_read_timeout 86400;


# HTTPS: un solo certificado para todos los nombres (visioncreativa.com y *.visioncreativa.com).
# Se genera con el comando de docs/https.md y queda en ./certs, montado en /etc/nginx/certs (docker-compose.yml).
# Está aquí fuera para que lo hereden todos los bloques server que escuchan en 443.
ssl_certificate     /etc/nginx/certs/visioncreativa.crt;
ssl_certificate_key /etc/nginx/certs/visioncreativa.key;
ssl_protocols       TLSv1.2 TLSv1.3;


# DNS interno de Docker (resuelve los contenedores al hacer la petición)
resolver 127.0.0.11 valid=30s;

# =====================================================================================
# HTTP → HTTPS: todo lo que llegue por el puerto 80, sea el nombre que sea, se redirige a https.
# (Si publicas el 443 en otro puerto, añádelo: https://$host:8443$request_uri)
# =====================================================================================
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}


# ---------- www ----------
server {
    listen 443 ssl default_server;  # default_serwww.visioncreativa.localhostver: recoge los nombres que no encajan en otro server 
    server_name www.visioncreativa.local visioncreativa.local www.visioncreativa.localhost visioncreativa.localhost;

    location / {
        root /usr/share/nginx/html/www;
        index index.html;
    }
}

# ---------- intranet ----------
server {
    listen 443 ssl;
    server_name intranet.visioncreativa.local intranet.visioncreativa.localhost;

    location / {
        root /usr/share/nginx/html/intranet;
        index index.html;
    }

    location = /code { return 301 /code/; }
    location /code/ {
        set $destino code:8443;
        rewrite ^/code(/.*)$ $1 break;
        proxy_pass http://$destino;
    }

    location = /portainer { return 301 /portainer/; }
    location /portainer/ {
        set $destino portainer:9000;
        rewrite ^/portainer(/.*)$ $1 break;
        proxy_pass http://$destino;
    }

    location = /adminer { return 301 /adminer/; }
    location /adminer/ {
        set $destino adminer:8080;
        rewrite ^/adminer(/.*)$ $1 break;
        proxy_pass http://$destino;
    }
}