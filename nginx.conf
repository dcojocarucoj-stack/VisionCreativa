# Cabeceras comunes para los proxys (WebSockets incluidos)
proxy_http_version 1.1;
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        "upgrade";
proxy_read_timeout 86400;

# DNS interno de Docker (resuelve los contenedores al hacer la petición)
resolver 127.0.0.11 valid=30s;

# ---------- HTTP -> HTTPS ----------
server {
    listen 80;
    server_name www.visioncreativa.local intranet.visioncreativa.local;
    return 301 https://$host$request_uri;
}

# ---------- www ----------
server {
    listen 443 ssl;
    http2 on;
    server_name www.visioncreativa.local;

    ssl_certificate     /etc/nginx/certs/visioncreativa.pem;
    ssl_certificate_key /etc/nginx/certs/visioncreativa-key.pem;

    location / {
        root /usr/share/nginx/html/www;
        index index.html;
    }
}

# ---------- intranet ----------
server {
    listen 443 ssl;
    http2 on;
    server_name intranet.visioncreativa.local;

    ssl_certificate     /etc/nginx/certs/visioncreativa.pem;
    ssl_certificate_key /etc/nginx/certs/visioncreativa-key.pem;

    location / {
        root /usr/share/nginx/html/intranet;
        index index.html;
    }

    location = /code { return 301 /code/; }
    location /code/ {
        set $destino code:8443;
        rewrite ^/code(/.*)$ $1 break;
        proxy_pass http://$destino;
    }

    location = /portainer { return 301 /portainer/; }
    location /portainer/ {
        set $destino portainer:9000;
        rewrite ^/portainer(/.*)$ $1 break;
        proxy_pass http://$destino;
    }

    location = /adminer { return 301 /adminer/; }
    location /adminer/ {
        set $destino adminer:8080;
        rewrite ^/adminer(/.*)$ $1 break;
        proxy_pass http://$destino;
    }
}