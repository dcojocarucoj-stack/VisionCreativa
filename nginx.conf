proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";

resolver 127.0.0.11 valid=30s;

server {
    listen 80;
    server_name www.visioncreativa.local;

    location / {
        root /usr/share/nginx/html/www;
        index index.html;
    }
}

server {
    listen 80;
    server_name intranet.visioncreativa.local;

    location / {
        root /usr/share/nginx/html/intranet;
        index index.html;
    }

    location = /code {
        return 301 /code/;
    }

    location /code/ {
        set $prefijo /code;
        set $destino code:8443;
        rewrite ^/code(/.*)$ $1 break;
        proxy_pass http://$destino;
    }

    location = /portainer {
        return 301 /portainer/;
    }

    location /portainer/ {
        set $prefijo /portainer;
        set $destino portainer:9000;
        rewrite ^/portainer(/.*)$ $1 break;
        proxy_pass http://$destino;
    }

    location = /adminer {
        return 301 /adminer/;
    }

    location /adminer/ {
        set $prefijo /adminer;
        set $destino adminer:8080;
        rewrite ^/adminer(/.*)$ $1 break;
        proxy_pass http://$destino;
    }
}

